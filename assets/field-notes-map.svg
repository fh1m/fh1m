<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 310" role="img" aria-labelledby="title desc">
  <title id="title">Mongla system boundary map</title>
  <desc id="desc">A system map showing operator, mission logic, and Hailo-8 perception on a Raspberry Pi sending intent over a 44-byte MAVLink frame to a 500 hertz control board that owns the actuators.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b10"/>
      <stop offset="1" stop-color="#111a24"/>
    </linearGradient>
    <style>
      .micro { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1.5px; fill: #8290a2; }
      .label { font: 600 17px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #f4f1ea; }
      .detail { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #a9b4c2; }
      .accent { font: 600 15px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #d6a35e; }
    </style>
  </defs>
  <rect width="1400" height="310" rx="20" fill="url(#bg)"/>
  <text x="36" y="38" class="micro">MONGLA / SYSTEM BOUNDARY / ONE NODE TOUCHES THE BOARD</text>
  <g transform="translate(42 76)">
    <rect width="270" height="172" rx="12" fill="#101923" stroke="#2d4052"/>
    <text x="24" y="32" class="micro">THINKING HALF</text>
    <text x="24" y="65" class="label">Raspberry Pi 5</text>
    <text x="24" y="93" class="detail">operator · mission logic</text>
    <text x="24" y="116" class="detail">Hailo-8 · 53.9 Hz</text>
    <text x="24" y="139" class="detail">EKF · optical flow · ROS 2</text>
  </g>
  <g transform="translate(520 76)">
    <rect width="360" height="172" rx="12" fill="#17161b" stroke="#6c5740"/>
    <text x="24" y="32" class="micro">THE SEAM</text>
    <text x="24" y="65" class="label">MAVLink 2 over USB-C</text>
    <text x="24" y="96" class="accent">44 bytes / one verb / no thrust</text>
    <text x="24" y="125" class="detail">high-level intent crosses here</text>
    <text x="24" y="148" class="detail">physical response does not</text>
  </g>
  <g transform="translate(1088 76)">
    <rect width="270" height="172" rx="12" fill="#0e1b19" stroke="#3e7967"/>
    <text x="24" y="32" class="micro">REFLEX HALF</text>
    <text x="24" y="65" class="label">SROT board</text>
    <text x="24" y="93" class="detail">sensors · depth · leak · kill</text>
    <text x="24" y="116" class="detail">500 Hz control loop</text>
    <text x="24" y="139" class="detail">mixer → 8 × ESC</text>
  </g>
  <path d="M322 162H500M900 162H1068" stroke="#7890a5" stroke-width="2"/>
  <path d="M486 152l18 10-18 10M1054 152l18 10-18 10" fill="#7890a5"/>
  <text x="334" y="145" class="micro">intent</text>
  <text x="914" y="145" class="micro">command</text>
  <text x="44" y="281" class="micro">STATUS / BENCH — BUILT — BLOCKED — WATER</text>
  <text x="1088" y="281" class="micro">WATER: NOT YET VERIFIED</text>
</svg>
