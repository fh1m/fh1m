<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Engineering signals</title>
  <desc id="desc">Three measured signals from the autonomy stack: 500 hertz board control, 53.9 hertz edge perception, and 18.0 milliseconds photon-to-detection latency.</desc>
  <rect width="1200" height="250" rx="18" fill="#10151c"/>
  <path d="M70 190H1130" stroke="#394552" stroke-width="2"/>
  <path d="M70 60H1130" stroke="#27313b" stroke-width="2"/>
  <path d="M70 125H1130" stroke="#27313b" stroke-width="2"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" fill="#f5f7fa">
    <text x="70" y="42" font-size="18" letter-spacing="3" fill="#90caf9">MEASURED SIGNALS</text>
    <text x="70" y="222" font-size="15" fill="#aeb9c5">control</text>
    <text x="455" y="222" font-size="15" fill="#aeb9c5">perception</text>
    <text x="840" y="222" font-size="15" fill="#aeb9c5">latency</text>
    <text x="70" y="104" font-size="30" font-weight="700">500 Hz</text>
    <text x="455" y="104" font-size="30" font-weight="700">53.9 Hz</text>
    <text x="840" y="104" font-size="30" font-weight="700">18.0 ms</text>
    <text x="70" y="139" font-size="14" fill="#aeb9c5">board reflex loop</text>
    <text x="455" y="139" font-size="14" fill="#aeb9c5">edge observation path</text>
    <text x="840" y="139" font-size="14" fill="#aeb9c5">photon to detection</text>
  </g>
  <circle cx="70" cy="190" r="9" fill="#90caf9"/>
  <circle cx="455" cy="190" r="9" fill="#ff8a80"/>
  <circle cx="840" cy="190" r="9" fill="#64b5f6"/>
  <path d="M70 190H455" stroke="#90caf9" stroke-width="5"/>
  <path d="M455 190H840" stroke="#ff8a80" stroke-width="5"/>
  <path d="M840 190H1130" stroke="#64b5f6" stroke-width="5"/>
</svg>
