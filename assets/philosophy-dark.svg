<svg width="760" height="224" viewBox="0 0 760 224" xmlns="http://www.w3.org/2000/svg" font-family="SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace">
  <rect width="760" height="224" fill="#0d1117"/>
  <text x="40" y="24" fill="#8b949e" font-size="12" letter-spacing="1">ENGINEERING PRINCIPLES — AS BUILT, NOT AS CLAIMED</text>

  <rect x="40" y="36" width="4" height="32" fill="#2ea043"/>
  <text x="56" y="50" fill="#e6edf3" font-size="13" font-weight="600">MEASUREMENT OVER ASSUMPTION</text>
  <text x="56" y="66" fill="#8b949e" font-size="11.5">every shipped constant carries its method and the conditions it was measured under</text>

  <rect x="40" y="82" width="4" height="32" fill="#58a6ff"/>
  <text x="56" y="96" fill="#e6edf3" font-size="13" font-weight="600">REFUSAL OVER INVENTION</text>
  <text x="56" y="112" fill="#8b949e" font-size="11.5">vision returns ALIGNED, LOST, TIMEOUT — never a guess dressed up as a target</text>

  <rect x="40" y="128" width="4" height="32" fill="#f0883e"/>
  <text x="56" y="142" fill="#e6edf3" font-size="13" font-weight="600">SEPARATION OF CONCERNS</text>
  <text x="56" y="158" fill="#8b949e" font-size="11.5">reflexes stay on the board, thinking stays on the Pi — nothing crosses but a command</text>

  <rect x="40" y="174" width="4" height="32" fill="#da3633"/>
  <text x="56" y="188" fill="#e6edf3" font-size="13" font-weight="600">REALITY PRECEDENCE</text>
  <text x="56" y="204" fill="#8b949e" font-size="11.5">the simulator models water's actual optics and failure modes, never ideal ones</text>
</svg>
